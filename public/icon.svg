<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" stroke="url(#gold)" stroke-width="6" fill="none" opacity="0.4" stroke-dasharray="8 8" />

  <!-- Audio Waveform Center -->
  <g transform="translate(256, 256)" stroke="url(#gold)" stroke-width="12" stroke-linecap="round">
    <line x1="-120" y1="-30" x2="-120" y2="30" opacity="0.6" />
    <line x1="-80" y1="-60" x2="-80" y2="60" opacity="0.8" />
    <line x1="-40" y1="-100" x2="-40" y2="100" />
    <line x1="0" y1="-130" x2="0" y2="130" stroke="url(#cyan)" stroke-width="14" />
    <line x1="40" y1="-100" x2="40" y2="100" />
    <line x1="80" y1="-60" x2="80" y2="60" opacity="0.8" />
    <line x1="120" y1="-30" x2="120" y2="30" opacity="0.6" />
  </g>

  <!-- Balochi Quill / Crescent Accent -->
  <path d="M 230 140 Q 256 120 282 140 Q 296 220 256 310 Q 216 220 230 140 Z" fill="url(#gold)" opacity="0.9" />
  <circle cx="256" cy="370" r="16" fill="url(#cyan)" />
</svg>
